meta:
  titre: Conditions générales de vente
  description: Conditions générales de vente des prestations de Pyrite.
titre: Conditions générales de vente
miseAJour: 12 novembre 2026
sections:
  - titre: 1. Objet et champ d'application
    texte: |-
      Les présentes conditions générales de vente (CGV) s'appliquent aux prestations vendues par Ewan Charpentier, entrepreneur individuel (micro-entreprise) exerçant sous le nom commercial Pyrite, SIRET 130 635 626 00018, joignable à ewan.charpentier@proton.me (ci-après « Pyrite »).

      Elles s'appliquent à tout client, particulier ou professionnel (ci-après « le client »). Toute réservation ou acceptation de devis vaut acceptation des CGV en vigueur à cette date.
    manque: ''
  - titre: Adresse du prestataire
    texte: ''
    manque: adresse professionnelle ou de domiciliation (obligatoire)
  - titre: 2. Prestations
    texte: |-
      Pyrite propose un accompagnement individuel à l'usage de l'IA générative :

      Appel initial (PYR-00) : un appel de 30 minutes pour comprendre la situation du client et lui recommander une offre.

      Premiers pas (PYR-01) : une séance de 60 minutes.

      Essentiel (PYR-02) : deux séances, de 60 puis 45 minutes, avec remise d'instructions pour 2 à 3 tâches et de Pyra.

      Ultra (PYR-03) : deux séances de 60 minutes, avec remise d'Athanor, construit sur mesure, et d'instructions pour les tâches choisies, puis une disponibilité de 4 semaines.

      Missions sur devis : tout besoin hors de ces formules, défini dans un devis.

      Le contenu détaillé de chaque offre est celui décrit sur la page Offres du site à la date de la commande. Les séances ont lieu en visio. Le client utilise son propre outil d'IA ; Pyrite ne fournit ni compte ni abonnement à ces outils.
    manque: ''
  - titre: 3. Prix
    texte: |-
      Les prix sont indiqués en euros. TVA non applicable, article 293 B du Code général des impôts : le prix affiché est le prix payé.

      Le prix applicable est celui en vigueur au jour de la réservation ou de l'acceptation du devis.

      En cas de passage d'une offre à l'autre, le montant déjà payé est déduit : après Premiers pas, l'Essentiel revient à 230 € ; après l'Essentiel, l'Ultra revient à 400 €.
    manque: ''
  - titre: 4. Commande et paiement
    texte: |-
      Appel initial : il est réservé en ligne et payé par carte bancaire à la réservation, via le prestataire de paiement Stripe.

      Autres offres : à l'issue de l'appel initial, Pyrite adresse un devis. La commande est ferme à l'acceptation du devis. Le prix est payé en totalité avant la première séance, sauf accord contraire écrit.

      Lorsque l'employeur du client finance la prestation, le devis est établi au nom de l'entreprise ; la facture est émise à réception du bon de commande et payable à 30 jours.

      Une facture est émise pour chaque paiement. Pour les clients professionnels, tout retard de paiement entraîne des pénalités au taux de trois fois le taux d'intérêt légal, ainsi qu'une indemnité forfaitaire de 40 € pour frais de recouvrement.
    manque: ''
  - titre: 5. Annulation et report
    texte: |-
      Appel initial : le client peut le déplacer ou l'annuler jusqu'à 24 heures avant l'heure prévue, depuis l'e-mail de confirmation. En cas d'annulation dans ce délai, les 29 € sont intégralement remboursés. Moins de 24 heures avant, ou en cas d'absence, l'appel reste dû.

      Séances : le client peut reporter une séance jusqu'à 24 heures avant l'heure prévue. Moins de 24 heures avant, ou en cas d'absence, la séance est considérée comme réalisée.

      Si Pyrite doit annuler un rendez-vous, il propose un nouveau créneau dans les meilleurs délais ; si aucun créneau ne convient, le rendez-vous non réalisé est remboursé.
    manque: ''
  - titre: 6. Droit de rétractation
    texte: |-
      Le client particulier (consommateur) dispose d'un délai de 14 jours à compter de la conclusion du contrat pour se rétracter, sans avoir à se justifier, en adressant une déclaration claire à ewan.charpentier@proton.me, ou le formulaire figurant en fin de page.

      Si le client demande expressément que la prestation commence avant la fin de ce délai, par exemple pour un appel initial réservé dans les 14 jours, il le confirme au moment de la réservation. Une prestation entièrement réalisée avant la fin du délai ne peut plus faire l'objet d'une rétractation. Si la prestation n'est que partiellement réalisée, le client paie la part déjà exécutée.

      En cas de rétractation, Pyrite rembourse les sommes dues dans les 14 jours, par le même moyen de paiement.

      Le droit de rétractation ne s'applique pas aux clients professionnels.
    manque: ''
  - titre: 7. Déroulé et engagements de chacun
    texte: |-
      Le client dispose d'une connexion internet et d'un compte sur un outil d'IA (l'offre gratuite suffit). Il travaille sur des exemples sans données confidentielles ni données personnelles de tiers, ou anonymisés, et respecte les règles de son employeur sur l'usage de l'IA. Pour l'Ultra, il transmet ses exemples de livrables dans les 3 jours qui suivent la première séance.

      Pyrite réalise les prestations avec soin et selon les règles de l'art. Les séances ne sont pas enregistrées. Les informations transmises par le client servent uniquement à la réalisation de la prestation et ne sont communiquées à aucun tiers.
    manque: ''
  - titre: 8. Livrables et délais
    texte: |-
      Premiers pas : le support de la séance en PDF, la cartographie des tâches du client et un message de suivi, envoyés dans la journée qui suit la séance.

      Essentiel : les instructions pour 2 à 3 tâches et Pyra, remises lors de la seconde séance.

      Ultra : Athanor est remis lors de la seconde séance, environ 7 jours ouvrés après réception des exemples du client ; la troisième instruction est envoyée ensuite. Pendant 4 semaines après la livraison, Pyrite reste disponible par e-mail, avec une réponse sous 2 jours ouvrés, et un appel de 30 minutes au plus si une question ne se règle pas par écrit. Les corrections d'Athanor sur les tâches livrées sont incluses ; de nouvelles tâches font l'objet d'un devis.
    manque: ''
  - titre: 9. Propriété intellectuelle
    texte: |-
      Pyrite reste titulaire de tous les droits sur ses supports, ses méthodes, Pyra et Athanor.

      Le client reçoit un droit d'usage personnel, non exclusif et non cessible des livrables, pour ses propres besoins. Il ne peut pas les reproduire pour des tiers, les diffuser, les revendre, les partager ni les mettre à la disposition de collègues ou d'autres personnes, sauf accord écrit de Pyrite.

      Les informations sur son métier que le client transmet pour construire Athanor restent sa propriété.
    manque: ''
  - titre: 10. Responsabilité
    texte: |-
      Pyrite est tenu à une obligation de moyens. Les outils d'IA peuvent produire des résultats inexacts : le client reste seul responsable de la vérification des résultats qu'il obtient, de l'usage qu'il en fait, et des données qu'il confie à ces outils.

      Pyrite n'est pas responsable des outils d'IA tiers : leur disponibilité, leurs conditions d'utilisation et leurs évolutions.

      Envers un client professionnel, la responsabilité de Pyrite est limitée au prix payé pour la prestation concernée.
    manque: ''
  - titre: 11. Données personnelles
    texte: Les données personnelles du client sont traitées conformément à la politique de confidentialité du site.
    manque: ''
  - titre: 12. Réclamations et droit applicable
    texte: |-
      Les CGV sont soumises au droit français. Toute réclamation est adressée d'abord par écrit à ewan.charpentier@proton.me ; Pyrite y répond dans les meilleurs délais.

      À défaut d'accord, le client particulier peut recourir gratuitement au médiateur de la consommation indiqué ci-dessous, ou saisir la juridiction compétente. Pour les clients professionnels, le tribunal compétent est celui du ressort du domicile de Pyrite.
    manque: ''
  - titre: 13. Médiation de la consommation
    texte: ''
    manque: nom, adresse et site du médiateur de la consommation (adhésion obligatoire)
  - titre: Formulaire de rétractation
    texte: |-
      À compléter et renvoyer uniquement si vous souhaitez vous rétracter du contrat.

      À l'attention d'Ewan Charpentier, Pyrite, ewan.charpentier@proton.me :

      Je vous notifie par la présente ma rétractation du contrat portant sur la prestation de services ci-dessous :

      Prestation : …

      Commandée le : …

      Nom du client : …

      Adresse du client : …

      Date : …

      Signature (uniquement en cas d'envoi sur papier) : …
    manque: ''
