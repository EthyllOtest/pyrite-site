meta:
  titre: Réserver l'appel initial
  description: "Réservez l'appel initial de Pyrite : 30 minutes, 29 €, pour comprendre votre situation et repérer où l'IA peut vous aider."
intro:
  label: PYR-00 · Appel initial
  titre: Réserver l'appel initial
  texte: "30 minutes pour comprendre votre situation et repérer où l'IA peut vous aider. À la fin, je vous présente les options avec mon conseil."
  suite: Le devis suit dans l'heure ; vous décidez ensuite.
deroule:
  titre: Ce qui se passe pendant 30 minutes
  etapes:
    - titre: Votre situation
      texte: Votre poste, ce que vous avez déjà essayé avec l'IA, ce qui vous a freiné.
    - titre: Vos tâches
      texte: "Pour chacune : le temps qu'elle prend, ce qui la rend pénible, à quoi ressemble un bon résultat."
    - titre: Vos contraintes
      texte: Votre objectif, l'échéance, qui finance, les données que vous manipulez.
    - titre: Les options et mon conseil
      texte: Les offres, puis celle que je vous recommande, et pourquoi.
avant:
  titre: Avant l'appel
  texte: "À la réservation, un court formulaire de 5 questions, environ 3 minutes. Vos réponses me permettent de préparer l'appel et ma recommandation."
  formulaire: |-
    1. Quel est votre poste, et dans quel secteur travaillez-vous ?

    2. Utilisez-vous déjà des outils d'IA (ChatGPT, Claude, Gemini, Copilot…) ? Jamais, de temps en temps, chaque semaine ou chaque jour ; et lesquels.

    3. Citez 2 ou 3 tâches qui vous prennent du temps chaque semaine.

    4. Qu'aimeriez-vous avoir changé, et pour quand ?

    5. Qui finance l'accompagnement, vous ou votre employeur ? Votre employeur encadre-t-il l'usage de l'IA ?
reservation:
  titre: Choisir un créneau
  texte: "Le calendrier de réservation s'ouvre ici : choix du créneau, formulaire préalable, paiement de 29 €."
  mentions: En réservant, vous acceptez les conditions générales de vente. Vos réponses au formulaire sont traitées selon la politique de confidentialité.
faq:
  - question: Faut-il préparer quelque chose ?
    reponse: Le formulaire suffit. Pensez à 2 ou 3 tâches concrètes de votre semaine.
  - question: Puis-je annuler ou déplacer l'appel ?
    reponse: "Oui, jusqu'à 24 heures avant, depuis l'e-mail de confirmation : vous choisissez un autre créneau, ou vous annulez et les 29 € vous sont remboursés. Moins de 24 heures avant, l'appel reste dû."
  - question: Et si aucune offre ne me convient ?
    reponse: "Je vous le dis pendant l'appel, sans insister. Vous repartez avec un premier repère sur votre tâche la plus favorable. Si votre besoin sort des formules, je peux vous proposer une mission sur devis."
  - question: Mes réponses sont-elles confidentielles ?
    reponse: "Oui. Elles servent uniquement à préparer l'appel et ma recommandation, ne sont transmises à personne, et vous pouvez demander leur suppression à tout moment. Le détail est dans la politique de confidentialité."
