meta:
  titre: À propos
  description: "Ewan, fondateur de Pyrite : parcours, réalisations et origine du nom."
intro:
  label: À propos
  titre: Ewan, fondateur de Pyrite
  presentation: |-
    J'ai 22 ans, et j'ai appris l'IA générative en autodidacte, par la pratique : construire des instructions, les tester, les améliorer jusqu'à ce qu'elles donnent un résultat fiable.

    J'ai créé Pyrite pour vous aider à prendre en main ces outils sur votre travail réel, en sachant où leur faire confiance et où s'en méfier.
parcours:
  titre: Parcours
  etapes:
    - dates: 2 ans
      texte: "Assistant chef de projet marketing chez Verbateam, filiale de prévention santé d'AXA. J'y ai conçu un méta-prompt, validé par AXA et mis à la disposition de ses collaborateurs."
    - dates: En cours
      texte: Master Manager Digital Innovation & Transformation IA.
    - dates: Aujourd'hui
      texte: "Fondateur de Pyrite : un accompagnement individuel pour utiliser l'IA là où elle vous aide vraiment."
realisation:
  label: Réalisation
  titre: Chez AXA
  texte: |-
    Chez Verbateam, filiale de prévention santé d'AXA, j'étais assistant chef de projet marketing. En parallèle de mes missions, j'ai conçu un méta-prompt : une instruction qui aide à construire d'autres instructions pour l'IA, sur le même principe que Pyra.

    Après validation par AXA, il a été publié dans la bibliothèque interne du groupe, à la disposition de tous ses collaborateurs.
  chiffres: []
nom:
  label: Le nom
  titre: Pourquoi « Pyrite »
  texte: "La pyrite, surnommée « l'or des fous », ressemble à l'or sans en avoir la valeur. Elle représente l'IA mal utilisée : brillante, proche de l'or, sans sa valeur. Pyrite vous aide à faire la différence."
final:
  titre: Faire connaissance
  texte: "Pendant l'appel initial, je vous présente aussi mon parcours et mes réalisations."
